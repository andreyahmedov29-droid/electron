<svg width="960" height="240" viewBox="0 0 960 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0EB6A3"/>
      <stop offset="1" stop-color="#05D5B7"/>
    </linearGradient>
    <linearGradient id="gMint" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#B8F5E4"/>
      <stop offset="1" stop-color="#E8FFF7"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0EB6A3" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- ===== Logo mark: dial + growth leaf ===== -->
  <g filter="url(#soft)">
    <circle cx="120" cy="120" r="92" fill="url(#gTeal)"/>
    <circle cx="120" cy="120" r="88" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>
  </g>

  <!-- time ticks -->
  <g stroke="#E9FFF8" stroke-width="4" stroke-linecap="round">
    <line x1="120" y1="48"  x2="120" y2="68"/>
    <line x1="120" y1="172" x2="120" y2="192"/>
    <line x1="48"  y1="120" x2="68"  y2="120"/>
    <line x1="172" y1="120" x2="192" y2="120"/>
  </g>

  <!-- growth leaf arrow rising to upper right = the "time to grow" mark -->
  <path d="M120 172
           C 104 158, 96 140, 96 120
           C 110 132, 120 138, 130 138
           C 112 118, 112 96, 128 76
           C 146 96, 158 112, 146 134
           C 144 152, 136 164, 120 172 Z"
        fill="url(#gMint)"/>

  <!-- small tick marker -->
  <circle cx="120" cy="120" r="20" fill="#0EB6A3" fill-opacity="0.25"/>
  <circle cx="120" cy="120" r="20" fill="url(#gMint)" fill-opacity="0.35"/>

  <!-- ===== Wordmark ===== -->
<text x="264" y="150" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-size="112" font-weight="800" letter-spacing="-1" fill="#0B2E33">
    <tspan fill="#0FB5A2">Таб</tspan><tspan fill="#18C7AE">ель</tspan>
  </text>

  <!-- subtle tagline -->
  <text x="268" y="192" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-size="22" font-weight="600" letter-spacing="7" fill="#5FBEB0">
    УЧЁТ  РАБОЧЕГО  ВРЕМЕНИ
  </text>
</svg>
