name: Build Windows

# Собирает Windows-версию BIOTIME (.exe) на Windows-раннере GitHub Actions и
# публикует её в GitHub Release «biotime-win-latest». Запускается по кнопке
# (workflow_dispatch) и при пуше в main/master, когда меняются файлы
# приложения/сборки. Автоинкремент версии НЕ делаем — его выполняет мак-джоб
# (mac-build.yml), чтобы не было двойного бампа на одном пуше; здесь читаем
# текущую версию из version.json.
on:
  push:
    branches: [main, master]
    paths:
      - "electron/**"
      - "server.js"
      - "app.js"
      - "index.html"
      - "styles.css"
      - "qr.js"
      - "package.json"
      - "package-lock.json"
      - "version.json"
  workflow_dispatch: # ручной запуск: вкладка Actions ▸ «Build Windows» ▸ Run workflow

jobs:
  build:
    runs-on: windows-latest
    # Нужно для публикации GitHub Release («biotime-win-latest») системным GITHUB_TOKEN.
    permissions:
      contents: write
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v5

      - name: Установить Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Установить зависимости
        run: npm ci

      # Единый источник версии — version.json в корне репозитория. Перед сборкой
      # сохраняем номер версии в переменную окружения, чтобы вписать его в имя
      # артефактов/релиза.
      - name: Прочитать версию из version.json
        id: ver
        shell: pwsh
        run: |
          $v = Get-Content version.json -Raw | ConvertFrom-Json
          "VN=$($v.versionName)" >> $env:GITHUB_OUTPUT
          "VC=$($v.versionCode)" >> $env:GITHUB_OUTPUT

      - name: Собрать приложение для Windows (x64)
        run: npx electron-builder --win --x64 --publish never

      - name: Выгрузить сборку как артефакт workflow
        uses: actions/upload-artifact@v5
        with:
          name: biotime-win
          path: dist/*.exe
          if-no-files-found: warn

      # Публикуем .exe в GitHub Release «biotime-win-latest». Прямая ссылка:
      #   https://github.com/<owner>/<repo>/releases/download/biotime-win-latest/BIOTIME Setup x.x.x.exe
      - name: Опубликовать сборку в GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: biotime-win-latest
          name: BIOTIME Windows v${{ steps.ver.outputs.VN }}
          body: |
            Автоматическая сборка Windows.
            Версия: v${{ steps.ver.outputs.VN }}
          files: dist/*.exe
          token: ${{ secrets.GITHUB_TOKEN }}
