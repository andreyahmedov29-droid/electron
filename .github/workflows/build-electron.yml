name: Build Electron

# Собирает десктоп-приложение BIOTIME (NSIS-установщик) и публикует его в
# GitHub Release репозитория «electron». Приложение само находит новую версию
# по latest.yml (electron-updater) и обновляется без ручной переустановки.
#
# Запускается:
#   - по кнопке: вкладка Actions ▸ „Build Electron“ ▸ Run workflow;
#   - при пуше в main (если файлы сборки/версия менялись).

on:
  push:
    branches: [main, master]
    paths:
      - "electron/**"
      - "package.json"
      - "package-lock.json"
      - "version.json"
      - "server.js"
      - "app.js"
      - "index.html"
      - "styles.css"
      - "qr.js"
      - "sw.js"
  workflow_dispatch: # ручной запуск

jobs:
  build:
    # Собираем Windows-установщик (NSIS) на Windows-раннере: electron-builder
    # для цели --win требует Wine только при сборке на Linux, а на windows-latest
    # NSIS-инсталлятор собирается нативно, без Wine. Это избавляет от ошибки
    # APP_BUILDER_CANNOT_EXECUTE («требуется wine») на ubuntu-раннере.
    runs-on: windows-latest
    permissions:
      contents: write # нужен для публикации Release системным GITHUB_TOKEN

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v5

      - name: Установить Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Установить зависимости
        run: npm ci

      # Берём версию из единого источника version.json и подставляем в
      # package.json. Так версия десктоп-сборки всегда совпадает с версией
      # сервера и APK (правка version.json — единственная точка обновления).
      - name: Синхронизировать версию из version.json
        run: |
          node -e '
            const fs = require("fs");
            const v = JSON.parse(fs.readFileSync("version.json", "utf8"));
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = (v.versionName || "1.0.0").replace(/^v/, "");
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            console.log("Версия desktop:", pkg.version);
          '

      # Публикуем установщик в GitHub Release. electron-builder сам:
      #   * собирает NSIS Setup-установщик;
      #   * генерирует latest.yml (манифест для автообновления);
      #   * загружает и установщик, и latest.yml в GitHub Release с тегом v<версия>.
      # Системный GITHUB_TOKEN уже имеет доступ к этому репозиторию и к его
      # Releases (permissions.contents: write), отдельный токен не нужен.
      - name: Собрать и опубликовать (publish to GitHub Release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run publish

      # electron-builder иногда оставляет release в статусе «черновик» (draft),
      # если прерывается загрузка артефактов (Setup exe / latest.yml). GitHub
      # не считает черновики «Последней версией», поэтому автообновление
      # (electron-updater по latest.yml) их не видит. Явно снимаем черновик и
      # помечаем релиз как Latest, чтобы новая версия публиковалась сама.
      - name: Опубликовать релиз (снять черновик)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./version.json').versionName.replace(/^v/,'')")
          echo "Публикуем релиз v$VERSION"
          gh release edit "v$VERSION" --draft=false --latest 2>/dev/null || \
            gh release edit "v$VERSION" --draft=false
