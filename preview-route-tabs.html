<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Редизайн вкладок — Маршрутизация (превью)</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #151a21;
    --line: rgba(255,255,255,.1);
    --line-strong: rgba(255,255,255,.2);
    --ink: #eef2f7;
    --ink-dim: rgba(238,242,247,.62);
    --amber: #ffab38;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(255,171,56,.08), transparent 60%),
      radial-gradient(900px 500px at 0% 110%, rgba(80,120,255,.07), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: ui-monospace, "Cascadia Code", "Consolas", monospace;
    padding: 40px 24px;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 1080px; }
  .hint {
    font-size: 12px;
    color: var(--ink-dim);
    letter-spacing: .04em;
    margin-bottom: 18px;
  }
  .card {
    background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01));
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 22px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 24px 60px rgba(0,0,0,.4);
  }
  .card-title { font-size: 18px; margin: 0 0 4px; letter-spacing: .01em; }
  .card-sub { font-size: 12px; color: var(--ink-dim); margin: 0 0 22px; }

  .drv-subtabs {
    position: relative;
    display: flex;
    gap: 8px;
    margin: 2px 0 18px;
    padding: 6px;
    overflow-x: auto;
    scrollbar-width: thin;
    border-radius: 16px;
    -webkit-overflow-scrolling: touch;
    background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
    border: 1px solid var(--line);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
  }
  .drv-subtab {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    border: 1px solid transparent;
    border-radius: 12px;
    background: transparent;
    color: var(--ink-dim);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .01em;
    white-space: nowrap;
    cursor: pointer;
    transition: color .15s ease, border-color .15s ease, background .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .drv-subtab svg { flex: none; opacity: .72; transition: opacity .15s ease, transform .15s ease; }
  .drv-subtab:hover { color: var(--ink); background: rgba(255,255,255,.06); border-color: var(--line-strong); transform: translateY(-1px); }
  .drv-subtab:hover svg { opacity: 1; transform: scale(1.12); }
  .drv-subtab.active {
    color: var(--amber);
    background: linear-gradient(180deg, rgba(255,171,56,.22), rgba(255,171,56,.10));
    border-color: rgba(255,171,56,.45);
    box-shadow: inset 0 0 0 1px rgba(255,171,56,.16), 0 6px 16px rgba(255,171,56,.16);
  }
  .drv-subtab.active svg { opacity: 1; }

  .panel {
    border: 1px dashed var(--line-strong);
    border-radius: 14px;
    padding: 16px;
    font-size: 12px;
    color: var(--ink-dim);
    background: rgba(255,255,255,.015);
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="hint">Превью редизайна вкладок раздела «Маршрутизация» — кликайте по вкладкам, чтобы увидеть переключение.</div>
  <div class="card">
    <h1 class="card-title">Маршрутизация</h1>
    <p class="card-sub">Контрагенты, адреса и дневные маршруты для водителей</p>

    <div class="drv-subtabs" id="tabs" role="tablist">
      <button type="button" class="drv-subtab active" data-sub="contr"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Контрагенты</span></button>
      <button type="button" class="drv-subtab" data-sub="route"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg><span>Маршрут на день</span></button>
      <button type="button" class="drv-subtab" data-sub="routes"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4" cy="6" r="1.4"/><circle cx="4" cy="12" r="1.4"/><circle cx="4" cy="18" r="1.4"/></svg><span>Маршруты</span></button>
      <button type="button" class="drv-subtab" data-sub="report"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v18h18"/><path d="M7 15l3-4 3 3 4-6"/></svg><span>Отчёт</span></button>
      <button type="button" class="drv-subtab" data-sub="location"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s7-5.3 7-11a7 7 0 1 0-14 0c0 5.7 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg><span>Местоположение</span></button>
      <button type="button" class="drv-subtab" data-sub="1clog"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M8 9h8M8 13h5"/></svg><span>Логи 1С</span></button>
      <button type="button" class="drv-subtab" data-sub="tracking"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a9 9 0 0 1 9 9c0 5-4 9-9 9s-9-4-9-9a9 9 0 0 1 9-9z"/><path d="M3.6 9h16.8M9 3.2C11 7 11 17 9 20.8M15 3.2c-2 3.8-2 13.8 0 17.6"/></svg><span>Трекинг</span></button>
    </div>

    <div class="panel" id="panel">Выбрана вкладка: <b>Контрагенты</b></div>
  </div>
</div>

<script>
  const tabs = document.getElementById("tabs");
  const panel = document.getElementById("panel");
  tabs.querySelectorAll(".drv-subtab").forEach((btn) => {
    btn.addEventListener("click", () => {
      tabs.querySelectorAll(".drv-subtab").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      panel.innerHTML = "Выбрана вкладка: <b>" + btn.querySelector("span").textContent + "</b>";
    });
  });
</script>
</body>
</html>
