<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Непрозрачный тёмный фон во весь холст (iOS не любит альфу) -->
  <rect width="1024" height="1024" fill="#13141C"/>
